<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2E52"/>
      <stop offset="100%" stop-color="#12324D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A94B"/>
      <stop offset="100%" stop-color="#C2983B"/>
    </linearGradient>
    <filter id="glowNavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A2E52" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Modern Emblem -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield with 8px radius -->
    <rect x="0" y="0" width="48" height="48" rx="8" fill="url(#navyGrad)" filter="url(#glowNavy)"/>
    
    <!-- Stylized Roofline -->
    <path d="M13 25 L24 14 L35 25" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Stylized Lower Pillars -->
    <path d="M17 26 V35 C17 36 18 37 19 37 H29 C30 37 31 36 31 35 V26" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>
    
    <!-- Golden Accent Key / Spark -->
    <circle cx="24" cy="27" r="4.5" fill="url(#goldGrad)"/>
    <path d="M24 31.5 V35" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Typography with Barlow aesthetic -->
  <g transform="translate(66, 12)">
    <!-- Brand Title: AJITH -->
    <text x="0" y="22" font-family="'Barlow', system-ui, sans-serif" font-size="25" font-weight="800" fill="#0A2E52" letter-spacing="-0.3">
      AJITH<tspan fill="#D4A94B">.</tspan>
    </text>
    
    <!-- Brand Subtitle / Tagline -->
    <text x="1" y="37" font-family="'Barlow', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#D4A94B" letter-spacing="1.6">
      MORTGAGE ADVISER
    </text>
  </g>
</svg>
